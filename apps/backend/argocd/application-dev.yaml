apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-backend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MuhammadElsaeed/TheDevOpsProject
    targetRevision: dev
    path: apps/backend/chart
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
