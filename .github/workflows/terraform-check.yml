name: Terraform checks

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
      - dev
    paths:
      - 'infra/**'

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Terraform fmt
        run: |
          terraform -chdir=infra/terraform fmt -check

      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform validate || true

      - name: tfsec scan
        uses: docker://liamg/tfsec:latest
        with:
          # pass the directory directly as the container argument; do not wrap with shell -c
          args: 'infra/terraform'
        continue-on-error: true

      - name: terrascan scan
        uses: docker://accurics/terrascan:latest
        with:
          # terrascan's entrypoint expects 'scan -d <dir>' arguments
          args: 'scan -d infra/terraform'
        continue-on-error: true
