name: CI — Backend

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_REGISTRY: ${{ secrets.ARTIFACT_REGISTRY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd apps/backend
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Run unit tests
        run: |
          cd apps/backend
          npm test

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/931968123240/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-actions-sa@thedevopsproject.iam.gserviceaccount.com"

      - name: Configure gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: thedevopsproject

      - id: build
        name: Build Docker image
        run: |
          IMAGE="${IMAGE_REGISTRY}/demo-backend:${GITHUB_SHA}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          docker build -t "$IMAGE" apps/backend
          echo "$IMAGE"

      - name: Push Docker image to Artifact Registry
        run: |
          # derive registry host from IMAGE_REGISTRY (e.g. europe-west4-docker.pkg.dev/theproject/repo)
          REGISTRY_HOST="${IMAGE_REGISTRY%%/*}"
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet
          IMAGE="${{ steps.build.outputs.image }}"
          docker push "$IMAGE"

      - name: Tag and push env alias
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            ALIAS="dev-latest"
          else
            ALIAS="prod-latest"
          fi
          IMAGE_ALIAS="${IMAGE_REGISTRY}/demo-backend:${ALIAS}"
          docker tag "$IMAGE" "$IMAGE_ALIAS"
          REGISTRY_HOST="${IMAGE_REGISTRY%%/*}"
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet
          docker push "$IMAGE_ALIAS"
          echo "Pushed alias $IMAGE_ALIAS"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}

      - name: Helm lint templates
        run: |
          helm version
          helm lint apps/backend/chart --set image.registry=${IMAGE_REGISTRY}
